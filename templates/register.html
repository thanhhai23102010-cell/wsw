<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
</head>
<body>

<h1>Đăng ký</h1>

<form method="POST">

    <input
        type="text"
        name="username"
        placeholder="Tên tài khoản"
    >

    <br><br>

    <input
        type="password"
        name="password"
        placeholder="Mật khẩu"
    >

    <br><br>

    <button type="submit">
        Đăng ký
    </button>

</form>

<br>

<a href="/login">
    Đăng nhập
</a>

</body>
</html>
