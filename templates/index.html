    <br>

    <!-- Search -->
    <form method="GET" action="/">

        <input
            type="text"
            name="query"
            placeholder="Tìm kiếm file hoặc nội dung..."
            value="{{ query }}"
        >

        <button type="submit">
            Tìm
        </button>

    </form>

    <hr>

    <!-- Danh sách file -->
    {% for file in files %}

    <div class="card">

        <h2>{{ file[1] }}</h2>

        <div class="buttons">

            <a href="{{ file[2] }}" target="_blank">
                Download
            </a>

            <a href="/preview/{{ file[0] }}">
                Preview
            </a>

            <a href="/delete/{{ file[0] }}">
                Delete
            </a>

        </div>

    </div>

    {% endfor %}
