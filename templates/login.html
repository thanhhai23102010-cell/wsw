<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

<h1>Đăng nhập</h1>

<form method="POST">

    <input
        type="text"
        name="username"
        placeholder="Tên tài khoản"
    >

    <br><br>

    <input
        type="password"
        name="password"
        placeholder="Mật khẩu"
    >

    <br><br>

    <button type="submit">
        Đăng nhập
    </button>

</form>

<br>

<a href="/register">
    Đăng ký
</a>

</body>
</html>
